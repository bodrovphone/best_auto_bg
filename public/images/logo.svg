<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" role="img" aria-label="Best Auto logo">
  <defs>
    <style>
      .logo-text { fill: #FFFFFF; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .accent { fill: #E1E100; }
      .accent-stroke { stroke: #E1E100; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Car icon -->
  <g transform="translate(2, 6)">
    <!-- Car body -->
    <path class="accent" d="M8 22 L12 12 Q13 10 15 10 L31 10 Q33 10 34 12 L38 22 L40 22 Q42 22 42 24 L42 30 Q42 32 40 32 L38 32 L38 30 L8 30 L8 32 L6 32 Q4 32 4 30 L4 24 Q4 22 6 22 Z" />
    <!-- Windshield cutout -->
    <path fill="#1a1a2e" d="M14 13 L17 13 L15.5 20 L11 20 Z" opacity="0.5" />
    <path fill="#1a1a2e" d="M19 13 L32 13 L35 20 L17 20 Z" opacity="0.5" />
    <!-- Wheels -->
    <circle cx="14" cy="32" r="4" fill="#1a1a2e" />
    <circle cx="14" cy="32" r="2.5" class="accent" opacity="0.6" />
    <circle cx="32" cy="32" r="4" fill="#1a1a2e" />
    <circle cx="32" cy="32" r="2.5" class="accent" opacity="0.6" />
    <!-- Headlight -->
    <rect x="38" y="24" width="3" height="2" rx="0.5" fill="#FFFFFF" opacity="0.9" />
    <!-- Taillight -->
    <rect x="5" y="24" width="2" height="2" rx="0.5" fill="#FF4444" opacity="0.7" />
    <!-- Speed lines -->
    <line x1="0" y1="18" x2="5" y2="18" class="accent-stroke" opacity="0.4" stroke-width="1" />
    <line x1="-2" y1="22" x2="4" y2="22" class="accent-stroke" opacity="0.3" stroke-width="1" />
    <line x1="0" y1="26" x2="4" y2="26" class="accent-stroke" opacity="0.2" stroke-width="1" />
  </g>

  <!-- "BEST" text -->
  <text class="logo-text" x="54" y="30" font-size="24" letter-spacing="2">BEST</text>

  <!-- "AUTO" text -->
  <text class="logo-text accent" x="128" y="30" font-size="24" letter-spacing="2">AUTO</text>

  <!-- Subtle underline accent -->
  <line x1="54" y1="36" x2="196" y2="36" stroke="#E1E100" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />

  <!-- Small tagline -->
  <text fill="#FFFFFF" opacity="0.5" x="54" y="45" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="6.5" letter-spacing="3" font-weight="400">USA  TO  BULGARIA</text>
</svg>