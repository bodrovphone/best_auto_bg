<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" role="img" aria-label="Best Auto logo">
  <defs>
    <filter id="carGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.18" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#C41E3A" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="carShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
  </defs>

  <!-- Aggressive supercar silhouette on the left -->
  <g transform="translate(50, 40)" filter="url(#carGlow)">
    <!-- Speed lines trailing behind -->
    <line x1="-48" y1="-2" x2="-33" y2="-2" stroke="#fff" stroke-width="1.3" stroke-linecap="round" opacity="0.28"/>
    <line x1="-52" y1="4" x2="-31" y2="4" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.2"/>
    <line x1="-46" y1="9" x2="-30" y2="9" stroke="#fff" stroke-width="0.8" stroke-linecap="round" opacity="0.14"/>
    <line x1="-44" y1="-7" x2="-34" y2="-7" stroke="#fff" stroke-width="0.7" stroke-linecap="round" opacity="0.1"/>

    <!-- Main car body - aggressive supercar with spoiler -->
    <path d="
      M-28 16 L-25 8 L-22 2 L-18 -4
      L-12 -10 L-4 -14 L4 -16
      L12 -16 L18 -14 L24 -11
      L28 -7 L32 -1 L34 4 L34 9
      L34 12 L33 16
      L27 16
      Q26 11 22 9 Q18 7 15 10 Q13 12 12 16
      L-6 16
      Q-7 11 -10 9 Q-14 7 -17 10 Q-19 12 -20 16 Z
    " fill="url(#carShine)"/>

    <!-- Rear spoiler -->
    <path d="M-27 2 L-32 -4 L-30 -6 L-25 -4 L-23 0" fill="#e0e0e0" stroke="#fff" stroke-width="0.3" opacity="0.85"/>

    <!-- Roof line highlight -->
    <path d="M-12 -10 L-4 -14 L4 -16 L12 -16 L18 -14 L24 -11 L28 -7" fill="none" stroke="#fff" stroke-width="0.7" opacity="0.5"/>

    <!-- Windshield -->
    <path d="
      M-9 -9 L2 -15 Q6 -16 10 -15.5 L17 -13
      Q22 -11 25 -8 L26 -5
      L-11 -5 Z
    " fill="#111318" opacity="0.6"/>

    <!-- Windshield frame -->
    <path d="M-9 -9 L2 -15 Q6 -16 10 -15.5 L17 -13 Q22 -11 25 -8" fill="none" stroke="#fff" stroke-width="0.35" opacity="0.3"/>

    <!-- Rear wheel -->
    <circle cx="-13" cy="16" r="7.5" fill="#0a0a0a"/>
    <circle cx="-13" cy="16" r="5.5" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="0.4"/>
    <circle cx="-13" cy="16" r="2.2" fill="#0e0e0e" stroke="#444" stroke-width="0.4"/>

    <!-- Front wheel -->
    <circle cx="20" cy="16" r="7.5" fill="#0a0a0a"/>
    <circle cx="20" cy="16" r="5.5" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="0.4"/>
    <circle cx="20" cy="16" r="2.2" fill="#0e0e0e" stroke="#444" stroke-width="0.4"/>

    <!-- Headlight -->
    <path d="M32 1 L35 2 L35 6 L33 5 Z" fill="#ffffff" opacity="0.8"/>

    <!-- Taillights -->
    <path d="M-27 1 L-24 -1 L-24 6 L-27 8 Z" fill="#C41E3A" opacity="0.85"/>

    <!-- Body crease -->
    <path d="M-24 4 Q-4 -1 12 -1 Q28 -1 33 3" fill="none" stroke="#fff" stroke-width="0.35" opacity="0.18"/>
  </g>

  <!-- "BEST" - heavy condensed bold, bordo/crimson -->
  <g filter="url(#textGlow)">
    <text x="100" y="53" fill="#C41E3A" font-family="'Impact', 'Arial Black', 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" letter-spacing="2">BEST</text>
  </g>

  <!-- "Auto" - italic, elegant, lighter white - flows right after BEST -->
  <text x="228" y="53" fill="#ffffff" font-family="'Georgia', 'Times New Roman', 'Palatino', serif" font-size="42" font-weight="400" font-style="italic" letter-spacing="1" opacity="0.92">Auto</text>
</svg>