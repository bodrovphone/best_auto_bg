<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Best Auto icon">
  <defs>
    <style>
      .accent { fill: #E1E100; }
    </style>
  </defs>

  <!-- Car body -->
  <path class="accent" d="M10 26 L15 14 Q16 12 18 12 L34 12 Q36 12 37 14 L42 26 L44 26 Q46 26 46 28 L46 35 Q46 37 44 37 L42 37 L42 35 L10 35 L10 37 L8 37 Q6 37 6 35 L6 28 Q6 26 8 26 Z" />

  <!-- Windshield cutouts -->
  <path fill="#1a1a2e" d="M17 15 L21 15 L19 24 L13.5 24 Z" opacity="0.5" />
  <path fill="#1a1a2e" d="M23 15 L35 15 L38.5 24 L20.5 24 Z" opacity="0.5" />

  <!-- Wheels -->
  <circle cx="17" cy="37" r="5" fill="#1a1a2e" />
  <circle cx="17" cy="37" r="3" class="accent" opacity="0.5" />
  <circle cx="17" cy="37" r="1.2" fill="#1a1a2e" />

  <circle cx="35" cy="37" r="5" fill="#1a1a2e" />
  <circle cx="35" cy="37" r="3" class="accent" opacity="0.5" />
  <circle cx="35" cy="37" r="1.2" fill="#1a1a2e" />

  <!-- Headlight -->
  <rect x="42" y="28" width="3" height="2.5" rx="0.8" fill="#FFFFFF" opacity="0.9" />

  <!-- Taillight -->
  <rect x="7" y="28" width="2.5" height="2.5" rx="0.8" fill="#FF4444" opacity="0.7" />

  <!-- Speed lines -->
  <line x1="1" y1="22" x2="7" y2="22" stroke="#E1E100" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  <line x1="-1" y1="26" x2="6" y2="26" stroke="#E1E100" stroke-width="1.2" stroke-linecap="round" opacity="0.3" />
  <line x1="1" y1="30" x2="6" y2="30" stroke="#E1E100" stroke-width="1.2" stroke-linecap="round" opacity="0.2" />
</svg>